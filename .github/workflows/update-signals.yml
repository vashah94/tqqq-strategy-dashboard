name: Update dashboard data

on:
  schedule:
    # 19:30 UTC = 2:30pm ET (EST) / 3:30pm ET (EDT).
    - cron: "30 19 * * 1-5"
    # 21:30 UTC = 4:30pm ET (EST) / 5:30pm ET (EDT) — after the 4pm market close either way.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send a test email even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy

      - name: Generate dashboard data
        run: python scripts/generate_dashboard_data.py

      - name: Email on signal change
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email == 'true' && '1' || '' }}
        run: python scripts/notify_email.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/signals.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
